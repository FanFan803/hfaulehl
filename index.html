<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>彈幕生存</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

:root {
  --cyan: #00f5ff;
  --pink: #ff2d78;
  --gold: #ffd700;
  --purple: #a855f7;
  --bg: #04080f;
  --panel: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.12);
  --glow-cyan: 0 0 20px rgba(0,245,255,0.4);
  --glow-pink: 0 0 20px rgba(255,45,120,0.4);
}

html, body {
  height: 100%; width: 100%;
  overflow: hidden; touch-action: none;
  background: var(--bg);
  font-family: 'Noto Sans TC', sans-serif;
  color: #fff;
}

#wrap {
  position: relative;
  width: 100%; height: 100%;
  max-width: 540px;
  margin: 0 auto;
  overflow: hidden;
  display: flex; flex-direction: column;
}

canvas {
  display: block; flex: 1;
  width: 100%; min-height: 0;
  image-rendering: crisp-edges;
}

/* ── HUD ── */
#hud {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 12px 16px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none; z-index: 5;
  background: linear-gradient(to bottom, rgba(4,8,15,0.9) 0%, transparent 100%);
}
#hud-left { display: flex; flex-direction: column; gap: 2px; }
#score-val {
  font-family: 'Orbitron', monospace;
  font-size: 1.5rem; font-weight: 700;
  color: var(--cyan);
  text-shadow: 0 0 10px rgba(0,245,255,0.6);
}
#score-label { font-size: 0.7rem; color: rgba(255,255,255,0.5); letter-spacing: 2px; text-transform: uppercase; }
#hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
#diff-badge {
  font-family: 'Orbitron', monospace;
  font-size: 0.65rem; font-weight: 700;
  padding: 3px 10px; border-radius: 20px;
  letter-spacing: 1px;
}
#speed-badge {
  font-size: 0.65rem; color: rgba(255,255,255,0.45);
}
#inv-badge {
  font-size: 0.65rem; padding: 2px 8px;
  background: rgba(255,215,0,0.15);
  border: 1px solid rgba(255,215,0,0.4);
  border-radius: 20px; color: var(--gold);
  display: none;
}

/* ── OVERLAYS ── */
.overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  z-index: 20; padding: 24px;
}
.overlay-bg {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 30%, rgba(0,245,255,0.06) 0%, rgba(4,8,15,0.97) 70%);
  backdrop-filter: blur(2px);
}
.overlay > * { position: relative; z-index: 1; }

.logo {
  font-family: 'Orbitron', monospace;
  font-size: clamp(1.8rem, 6vw, 2.8rem);
  font-weight: 900;
  color: #fff;
  text-shadow: 0 0 30px rgba(0,245,255,0.5), 0 0 60px rgba(0,245,255,0.2);
  letter-spacing: 3px;
  text-align: center;
  margin-bottom: 6px;
}
.logo-sub {
  font-size: 0.75rem; color: rgba(255,255,255,0.4);
  letter-spacing: 4px; text-transform: uppercase;
  text-align: center; margin-bottom: 36px;
}

/* difficulty grid */
.diff-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px; width: 100%; max-width: 340px;
}
.diff-btn {
  position: relative; overflow: hidden;
  padding: 16px 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: #fff; cursor: pointer;
  text-align: left;
  transition: border-color 0.2s, transform 0.15s;
  -webkit-appearance: none;
}
.diff-btn:active { transform: scale(0.96); }
.diff-btn-name {
  font-family: 'Orbitron', monospace;
  font-size: 0.85rem; font-weight: 700;
  display: block; margin-bottom: 4px;
}
.diff-btn-desc {
  font-size: 0.7rem; color: rgba(255,255,255,0.5);
  display: block; line-height: 1.4;
}
.diff-btn-pip {
  position: absolute; top: 10px; right: 10px;
  width: 8px; height: 8px; border-radius: 50%;
}
.diff-btn[data-d="easy"]   { border-color: rgba(0,245,255,0.35); }
.diff-btn[data-d="easy"] .diff-btn-name   { color: var(--cyan); }
.diff-btn[data-d="easy"] .diff-btn-pip   { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
.diff-btn[data-d="medium"] { border-color: rgba(168,85,247,0.35); }
.diff-btn[data-d="medium"] .diff-btn-name { color: var(--purple); }
.diff-btn[data-d="medium"] .diff-btn-pip { background: var(--purple); box-shadow: 0 0 8px var(--purple); }
.diff-btn[data-d="hard"]   { border-color: rgba(255,45,120,0.35); }
.diff-btn[data-d="hard"] .diff-btn-name   { color: var(--pink); }
.diff-btn[data-d="hard"] .diff-btn-pip   { background: var(--pink); box-shadow: 0 0 8px var(--pink); }
.diff-btn[data-d="eason"]  { grid-column: span 2; border-color: rgba(255,215,0,0.4); background: rgba(255,215,0,0.06); }
.diff-btn[data-d="eason"] .diff-btn-name  { color: var(--gold); font-size: 1rem; }
.diff-btn[data-d="eason"] .diff-btn-pip  { background: var(--gold); box-shadow: 0 0 8px var(--gold); }

/* settings row */
.settings-row {
  display: flex; align-items: center; gap: 10px;
  margin-top: 20px; padding: 12px 16px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; width: 100%; max-width: 340px;
  cursor: pointer;
}
.settings-row span:first-child {
  font-size: 0.8rem; color: rgba(255,255,255,0.6); flex: 1;
}
.toggle {
  width: 42px; height: 24px; border-radius: 12px;
  background: rgba(255,255,255,0.15);
  position: relative; transition: background 0.2s;
  flex-shrink: 0;
}
.toggle.on { background: var(--gold); }
.toggle::after {
  content: ''; position: absolute;
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; top: 3px; left: 3px;
  transition: transform 0.2s;
}
.toggle.on::after { transform: translateX(18px); }
.toggle-label { font-size: 0.75rem; color: rgba(255,255,255,0.4); min-width: 30px; }

/* ── GAME OVER ── */
#gameover-ui { display: none; }
.go-title {
  font-family: 'Orbitron', monospace;
  font-size: clamp(2rem, 8vw, 3.2rem);
  font-weight: 900; text-align: center;
  margin-bottom: 8px;
}
.go-score {
  font-family: 'Orbitron', monospace;
  font-size: 1.1rem; color: rgba(255,255,255,0.7);
  margin-bottom: 4px;
}
.go-best {
  font-size: 0.8rem; color: rgba(255,255,255,0.4);
  margin-bottom: 36px;
}
.go-best span { color: var(--gold); }
.go-btns { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 280px; }
.go-btn {
  padding: 16px; border-radius: 50px;
  font-family: 'Orbitron', monospace;
  font-size: 0.9rem; font-weight: 700;
  letter-spacing: 2px; cursor: pointer;
  border: 2px solid rgba(255,255,255,0.3);
  background: transparent; color: #fff;
  transition: all 0.2s; -webkit-appearance: none;
}
.go-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
.go-btn.primary { border-color: var(--cyan); color: var(--cyan); }

/* ── PAUSE BTN ── */
#pause-btn {
  position: absolute; top: 12px; right: 16px;
  width: 36px; height: 36px;
  border-radius: 50%; border: 1px solid var(--border);
  background: rgba(4,8,15,0.8);
  color: rgba(255,255,255,0.6);
  font-size: 0.7rem; cursor: pointer; z-index: 8;
  display: none; align-items: center; justify-content: center;
  -webkit-appearance: none;
}

/* ── PAUSE OVERLAY ── */
#pause-ui { display: none; }
.pause-title {
  font-family: 'Orbitron', monospace;
  font-size: 2rem; font-weight: 900; margin-bottom: 32px;
  color: rgba(255,255,255,0.8);
}

/* ── Stars background ── */
#starfield {
  position: absolute; inset: 0; z-index: 0;
  pointer-events: none; overflow: hidden;
}
.star {
  position: absolute; background: #fff; border-radius: 50%;
  animation: twinkle linear infinite;
}
@keyframes twinkle {
  0%,100% { opacity: 0.1; }
  50% { opacity: 0.7; }
}
</style>
</head>
<body>
<div id="wrap">

  <!-- Starfield -->
  <div id="starfield"></div>

  <!-- HUD -->
  <div id="hud">
    <div id="hud-left">
      <div id="score-label">SCORE</div>
      <div id="score-val">0</div>
    </div>
    <div id="hud-right">
      <div id="diff-badge">EASY</div>
      <div id="speed-badge">×1.00</div>
      <div id="inv-badge">🛡 無敵</div>
    </div>
  </div>

  <!-- Pause btn -->
  <button id="pause-btn" onclick="togglePause()" aria-label="暫停">⏸</button>

  <!-- MENU -->
  <div id="menu-ui" class="overlay">
    <div class="overlay-bg"></div>
    <div class="logo">彈幕生存</div>
    <div class="logo-sub">BULLET HELL SURVIVAL</div>

    <div class="diff-grid">
      <button class="diff-btn" data-d="easy" onclick="startGame('easy')">
        <div class="diff-btn-pip"></div>
        <span class="diff-btn-name">EASY</span>
        <span class="diff-btn-desc">適合新手<br>緩速單發</span>
      </button>
      <button class="diff-btn" data-d="medium" onclick="startGame('medium')">
        <div class="diff-btn-pip"></div>
        <span class="diff-btn-name">MEDIUM</span>
        <span class="diff-btn-desc">雙發散射<br>中等速度</span>
      </button>
      <button class="diff-btn" data-d="hard" onclick="startGame('hard')">
        <div class="diff-btn-pip"></div>
        <span class="diff-btn-name">HARD</span>
        <span class="diff-btn-desc">追蹤子彈<br>高速密集</span>
      </button>
      <button class="diff-btn" data-d="eason" onclick="startGame('eason')">
        <div class="diff-btn-pip"></div>
        <span class="diff-btn-name">EASON 陳</span>
        <span class="diff-btn-desc">極速混合彈幕 · 非人類難度</span>
      </button>
    </div>

    <div class="settings-row" onclick="toggleInvincible()">
      <span>🛡 無敵模式（練習用）</span>
      <div class="toggle" id="inv-toggle"></div>
      <span class="toggle-label" id="inv-label">OFF</span>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="gameover-ui" class="overlay">
    <div class="overlay-bg"></div>
    <div class="go-title" id="go-title">GAME OVER</div>
    <div class="go-score" id="go-score">得分：0</div>
    <div class="go-best" id="go-best">最高紀錄：<span id="go-best-val">0</span></div>
    <div class="go-btns">
      <button class="go-btn primary" onclick="startGame(lastDiff)">再玩一次</button>
      <button class="go-btn" onclick="showMenu()">選擇難度</button>
    </div>
  </div>

  <!-- PAUSE -->
  <div id="pause-ui" class="overlay">
    <div class="overlay-bg"></div>
    <div class="pause-title">PAUSED</div>
    <div class="go-btns">
      <button class="go-btn primary" onclick="togglePause()">繼續</button>
      <button class="go-btn" onclick="quitToMenu()">放棄</button>
    </div>
  </div>

  <canvas id="gc"></canvas>
</div>

<script>
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');

const scoreVal   = document.getElementById('score-val');
const diffBadge  = document.getElementById('diff-badge');
const speedBadge = document.getElementById('speed-badge');
const invBadge   = document.getElementById('inv-badge');
const menuUI     = document.getElementById('menu-ui');
const goUI       = document.getElementById('gameover-ui');
const pauseUI    = document.getElementById('pause-ui');
const pauseBtn   = document.getElementById('pause-btn');
const goTitle    = document.getElementById('go-title');
const goScore    = document.getElementById('go-score');
const goBestVal  = document.getElementById('go-best-val');
const invToggle  = document.getElementById('inv-toggle');
const invLabel   = document.getElementById('inv-label');

// ── STATE ─────────────────────────────────────────────
let state = 'menu'; // menu | playing | paused | over
let score = 0;
let speedMult = 1.0;
let bullets = [];
let particles = [];
let invincible = false;
let lastDiff = 'easy';
let spawnTimer = null;
let raf = null;
let bests = { easy: 0, medium: 0, hard: 0, eason: 0 };
let frameCount = 0;
let shakeFrames = 0;
let bgStars = [];

const player = { x: 0, y: 0, r: 14, trail: [] };
const HITBOX_SCALE = 0.55; // generous hitbox

// ── DIFFICULTIES ──────────────────────────────────────
const DIFF = {
  easy: {
    label: 'EASY', color: '#00f5ff',
    interval: 700, speed: 3.5, spread: false,
    patterns: ['straight'],
    bulletR: 13, bulletColor: '#00f5ff', borderColor: '#0088aa',
    desc: 'EASY'
  },
  medium: {
    label: 'MEDIUM', color: '#a855f7',
    interval: 460, speed: 5.5, spread: true,
    patterns: ['straight', 'double', 'angled'],
    bulletR: 12, bulletColor: '#d89cf6', borderColor: '#7c3aed',
    desc: 'MEDIUM'
  },
  hard: {
    label: 'HARD', color: '#ff2d78',
    interval: 300, speed: 8, spread: true,
    patterns: ['straight', 'double', 'triple', 'homing', 'burst'],
    bulletR: 11, bulletColor: '#ff6aa7', borderColor: '#cc1155',
    desc: 'HARD'
  },
  eason: {
    label: 'EASON 陳', color: '#ffd700',
    interval: 130, speed: 13, spread: true,
    patterns: ['straight', 'double', 'triple', 'homing', 'burst', 'wave', 'spiral'],
    bulletR: 10, bulletColor: '#ffe566', borderColor: '#cc9900',
    desc: 'EASON陳'
  }
};

// ── STARS BG ──────────────────────────────────────────
function buildStarfield() {
  const sf = document.getElementById('starfield');
  sf.innerHTML = '';
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 2 + 0.5;
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*5}s`;
    sf.appendChild(s);
  }
}
buildStarfield();

// ── RESIZE ────────────────────────────────────────────
function resize() {
  canvas.width  = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  if (state !== 'playing' && state !== 'paused') {
    player.x = canvas.width / 2;
    player.y = canvas.height * 0.8;
  }
}
window.addEventListener('resize', resize);
resize();

// ── INPUT ─────────────────────────────────────────────
function handleMove(cx, cy) {
  if (state !== 'playing') return;
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width  / rect.width;
  const sy = canvas.height / rect.height;
  player.x = (cx - rect.left) * sx;
  player.y = (cy - rect.top)  * sy;
}
canvas.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  handleMove(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  handleMove(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

// ── INVINCIBLE TOGGLE ─────────────────────────────────
function toggleInvincible() {
  invincible = !invincible;
  invToggle.classList.toggle('on', invincible);
  invLabel.textContent = invincible ? 'ON' : 'OFF';
}

// ── START / MENU / PAUSE ──────────────────────────────
function startGame(diff) {
  lastDiff = diff;
  state = 'playing';
  score = 0; speedMult = 1.0; frameCount = 0;
  bullets = []; particles = [];
  player.trail = [];
  player.x = canvas.width / 2;
  player.y = canvas.height * 0.8;

  const cfg = DIFF[diff];
  diffBadge.textContent = cfg.label;
  diffBadge.style.background = cfg.color + '22';
  diffBadge.style.border = `1px solid ${cfg.color}55`;
  diffBadge.style.color = cfg.color;
  invBadge.style.display = invincible ? 'block' : 'none';

  menuUI.style.display  = 'none';
  goUI.style.display    = 'none';
  pauseUI.style.display = 'none';
  pauseBtn.style.display = 'flex';

  clearTimeout(spawnTimer);
  if (raf) cancelAnimationFrame(raf);
  scheduleSpawn();
  raf = requestAnimationFrame(loop);
}

function showMenu() {
  state = 'menu';
  clearTimeout(spawnTimer);
  if (raf) cancelAnimationFrame(raf);
  menuUI.style.display  = 'flex';
  goUI.style.display    = 'none';
  pauseUI.style.display = 'none';
  pauseBtn.style.display = 'none';
  // redraw blank
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function togglePause() {
  if (state === 'playing') {
    state = 'paused';
    clearTimeout(spawnTimer);
    pauseUI.style.display = 'flex';
    pauseBtn.textContent = '▶';
  } else if (state === 'paused') {
    state = 'playing';
    pauseUI.style.display = 'none';
    pauseBtn.textContent = '⏸';
    scheduleSpawn();
    raf = requestAnimationFrame(loop);
  }
}

function quitToMenu() { showMenu(); }

// ── SPAWN ─────────────────────────────────────────────
function scheduleSpawn() {
  if (state !== 'playing') return;
  const cfg = DIFF[lastDiff];
  const delay = cfg.interval / speedMult;
  spawnTimer = setTimeout(() => { spawnWave(); scheduleSpawn(); }, delay);
}

function spawnWave() {
  const cfg = DIFF[lastDiff];
  const pool = cfg.patterns;
  const pattern = pool[Math.floor(Math.random() * pool.length)];
  const speed = cfg.speed * speedMult;
  const r = cfg.bulletR;
  const W = canvas.width;

  switch (pattern) {
    case 'straight': {
      const x = rand(r + 20, W - r - 20);
      addBullet(x, -r, 0, speed, r, cfg);
      break;
    }
    case 'double': {
      for (let i = 0; i < 2; i++) {
        const x = rand(r + 20, W - r - 20);
        addBullet(x, -r, (Math.random() - 0.5) * 1.5, speed, r, cfg);
      }
      break;
    }
    case 'angled': {
      const x = rand(r + 20, W - r - 20);
      const angle = (Math.random() - 0.5) * 0.6;
      addBullet(x, -r, Math.sin(angle) * speed, Math.cos(angle) * speed, r, cfg, true);
      break;
    }
    case 'triple': {
      const cx = rand(60, W - 60);
      for (let i = -1; i <= 1; i++) {
        addBullet(cx + i * 30, -r, i * 1.2, speed, r, cfg);
      }
      break;
    }
    case 'homing': {
      const x = rand(r + 20, W - r - 20);
      addBullet(x, -r, 0, speed * 0.7, r, cfg, false, true);
      break;
    }
    case 'burst': {
      const cx = rand(80, W - 80);
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2;
        addBullet(cx, -r * 2, Math.cos(a) * speed * 0.6, Math.sin(a) * speed * 0.6 + speed * 0.5, r * 0.85, cfg);
      }
      break;
    }
    case 'wave': {
      for (let i = 0; i < 4; i++) {
        const x = (W / 5) * (i + 1);
        addBullet(x, -r, Math.sin(Date.now() / 300 + i) * 2, speed, r * 0.9, cfg);
      }
      break;
    }
    case 'spiral': {
      const cx = rand(80, W - 80);
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI * 2 + Date.now() / 500;
        addBullet(cx, canvas.height * 0.1, Math.cos(a) * speed * 0.8, Math.abs(Math.sin(a)) * speed + 1, r, cfg);
      }
      break;
    }
  }
}

function addBullet(x, y, dx, dy, r, cfg, useAbsSpeed, homing) {
  if (useAbsSpeed) {
    bullets.push({ x, y, dx, dy, r, cfg, homing: !!homing, age: 0 });
  } else {
    bullets.push({ x, y, dx, dy, r, cfg, homing: !!homing, age: 0 });
  }
}

function rand(a, b) { return Math.random() * (b - a) + a; }

// ── PARTICLES ─────────────────────────────────────────
function spawnParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const sp = rand(1.5, 5);
    particles.push({
      x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 1.0, decay: rand(0.04, 0.09),
      r: rand(2, 5), color
    });
  }
}

// ── MAIN LOOP ─────────────────────────────────────────
let lastTime = 0;
function loop(ts) {
  if (state !== 'playing') return;
  const dt = Math.min((ts - lastTime) / 16.67, 3);
  lastTime = ts;
  frameCount++;

  // Score & speed
  score += dt;
  const scoreInt = Math.floor(score);
  scoreVal.textContent = scoreInt.toLocaleString();
  speedMult = 1 + Math.floor(scoreInt / 300) * 0.08;
  speedBadge.textContent = `×${speedMult.toFixed(2)}`;

  // Canvas
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#04080f';
  ctx.fillRect(0, 0, W, H);

  // Shake
  let sx = 0, sy = 0;
  if (shakeFrames > 0) {
    sx = (Math.random() - 0.5) * 6;
    sy = (Math.random() - 0.5) * 6;
    shakeFrames--;
    ctx.save();
    ctx.translate(sx, sy);
  }

  // Grid scanlines (subtle)
  ctx.strokeStyle = 'rgba(255,255,255,0.018)';
  ctx.lineWidth = 1;
  for (let y2 = 0; y2 < H; y2 += 40) {
    ctx.beginPath(); ctx.moveTo(0, y2); ctx.lineTo(W, y2); ctx.stroke();
  }

  // Player trail
  player.trail.push({ x: player.x, y: player.y });
  if (player.trail.length > 12) player.trail.shift();
  for (let i = 0; i < player.trail.length; i++) {
    const t = player.trail[i];
    const alpha = (i / player.trail.length) * 0.4;
    ctx.beginPath();
    ctx.arc(t.x, t.y, player.r * (i / player.trail.length), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,245,255,${alpha})`;
    ctx.fill();
  }

  // Player
  const pr = player.r;
  // Outer glow ring
  ctx.beginPath();
  ctx.arc(player.x, player.y, pr + 8, 0, Math.PI * 2);
  ctx.strokeStyle = invincible ? 'rgba(255,215,0,0.3)' : 'rgba(0,245,255,0.2)';
  ctx.lineWidth = 2;
  ctx.stroke();
  // Body
  ctx.beginPath();
  ctx.arc(player.x, player.y, pr, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(player.x - pr * 0.3, player.y - pr * 0.3, 1, player.x, player.y, pr);
  grad.addColorStop(0, invincible ? '#fff8cc' : '#80faff');
  grad.addColorStop(1, invincible ? '#ffd700' : '#00c8d4');
  ctx.fillStyle = grad;
  ctx.fill();
  // Hitbox dot
  ctx.beginPath();
  ctx.arc(player.x, player.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = invincible ? '#ffd700' : '#fff';
  ctx.fill();
  // Hitbox circle (subtle)
  ctx.beginPath();
  ctx.arc(player.x, player.y, pr * HITBOX_SCALE, 0, Math.PI * 2);
  ctx.strokeStyle = invincible ? 'rgba(255,215,0,0.5)' : 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.age += dt;

    // Homing logic
    if (b.homing) {
      const tx = player.x - b.x, ty = player.y - b.y;
      const dist = Math.sqrt(tx * tx + ty * ty);
      if (dist > 1) {
        const homingStr = 0.12 * dt;
        b.dx += (tx / dist) * homingStr;
        b.dy += (ty / dist) * homingStr;
        const spd = Math.sqrt(b.dx * b.dx + b.dy * b.dy);
        const maxSpd = DIFF[lastDiff].speed * speedMult * 0.9;
        if (spd > maxSpd) { b.dx = b.dx / spd * maxSpd; b.dy = b.dy / spd * maxSpd; }
      }
    }

    // Wave wobble for non-homing
    if (!b.homing && b.age > 0) {
      b.dx += Math.sin(b.age * 0.08) * 0.03 * dt;
    }

    b.x += b.dx * dt;
    b.y += b.dy * dt;

    // Draw bullet
    const r = b.r;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    const bg2 = ctx.createRadialGradient(b.x - r * 0.3, b.y - r * 0.4, 1, b.x, b.y, r);
    bg2.addColorStop(0, '#fff');
    bg2.addColorStop(0.5, b.cfg.bulletColor);
    bg2.addColorStop(1, b.cfg.borderColor);
    ctx.fillStyle = bg2;
    ctx.fill();
    // Glow outline
    ctx.beginPath();
    ctx.arc(b.x, b.y, r + 2, 0, Math.PI * 2);
    ctx.strokeStyle = b.cfg.bulletColor + '55';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Collision
    if (!invincible) {
      const dx = b.x - player.x, dy = b.y - player.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < (b.r + pr) * HITBOX_SCALE) {
        spawnParticles(player.x, player.y, '#00f5ff');
        spawnParticles(b.x, b.y, b.cfg.bulletColor);
        shakeFrames = 12;
        endGame();
        if (shakeFrames > 0) ctx.restore();
        return;
      }
    }

    // Out of bounds
    if (b.y > H + 60 || b.x < -60 || b.x > W + 60) {
      bullets.splice(i, 1);
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 0.1 * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fillStyle = p.color + Math.floor(p.life * 255).toString(16).padStart(2,'0');
    ctx.fill();
  }

  if (shakeFrames > 0) ctx.restore();

  raf = requestAnimationFrame(loop);
}

// ── END GAME ──────────────────────────────────────────
function endGame() {
  state = 'over';
  clearTimeout(spawnTimer);

  const s = Math.floor(score);
  if (s > bests[lastDiff]) bests[lastDiff] = s;

  const cfg = DIFF[lastDiff];
  goTitle.textContent = lastDiff === 'eason' ? 'EASON 陳 勝了' : 'GAME OVER';
  goTitle.style.color = lastDiff === 'eason' ? '#ffd700' : '#ff2d78';
  goScore.textContent = `得分：${s.toLocaleString()}`;
  goBestVal.textContent = bests[lastDiff].toLocaleString();

  pauseBtn.style.display = 'none';
  goUI.style.display = 'flex';
}
</script>
